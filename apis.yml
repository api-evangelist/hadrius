aid: hadrius
name: Hadrius
description: 'Hadrius is an AI-native compliance platform for SEC- and FINRA-regulated
  financial firms, including broker-dealers, registered investment advisors (RIAs),
  private funds, and compliance consultants. The platform consolidates multiple compliance
  functions into a single system of record with human governance: a testing program
  that automates compliance testing and audit reporting, AI-powered marketing review
  and content approval workflows, people oversight for personal trading, attestations
  and certifications, communications archiving that supervises email, chat, and social
  media with zero-retention AI, and account surveillance that monitors trades against
  restricted lists and blackout windows. Hadrius serves 500+ institutions managing
  over $5 trillion in AUM, raised a $22M Series A, and is backed by Y Combinator and
  CRV. The company is SOC 2 Type II and ISO 27001 certified and GDPR compliant. This
  profile currently documents no public developer API; it is maintained as a company
  record in the API Evangelist network.'
